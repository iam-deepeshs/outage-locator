databases:
  - name: outage-locator-db
    plan: free
    databaseName: outage_locator
    user: outage

services:
  - type: web
    name: outage-locator-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: outage-locator-db
          property: connectionString
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: outage-locator-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://outage-locator-backend.onrender.com
